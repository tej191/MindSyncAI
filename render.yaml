services:
  - type: web
    name: mindsyncai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mindsyncai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: mindsyncai-db
    databaseName: mindsyncai
    user: mindsyncai
